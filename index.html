<!doctype html>
<html lang="en" class="dark">
  
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta name="theme-color" content="#07080c" />
  <meta name="color-scheme" content="dark" />

  <!-- Primary SEO -->
  <title>RandomTalks – Free Random Voice & Video Chat</title>

  <meta
    name="description"
    content="Meet new people and start real conversations on RandomTalks. Connect with strangers through random voice and video chat. No registration required."
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  />

  <link
    rel="canonical"
    href="https://www.randomtalks.tech/"
  />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RandomTalks" />

  <meta
    property="og:title"
    content="RandomTalks – Meet New People, Start Real Conversations"
  />

  <meta
    property="og:description"
    content="No sign-up. No registration. Discover new conversations through random voice and video chat on RandomTalks."
  />

  <meta
    property="og:url"
    content="https://www.randomtalks.tech/"
  />

  <meta
    property="og:locale"
    content="en_IN"
  />

  <!-- Twitter / X Sharing -->
  <meta name="twitter:card" content="summary" />

  <meta
    name="twitter:title"
    content="RandomTalks – Free Random Voice & Video Chat"
  />

  <meta
    name="twitter:description"
    content="Meet new people and start real conversations. Explore RandomTalks, with no registration required."
  />

  <!-- Mobile Web App -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <!-- Performance: Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Existing Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2307080c' stroke='%23238b5cf6' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%23238b5cf6'/><path d='M30 50 A20 20 0 0 1 70 50' fill='none' stroke='%2306b6d4' stroke-width='4' stroke-linecap='round'/></svg>"
  />
</head>

  <body class="bg-[#07080c] text-slate-100 antialiased selection:bg-violet-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
